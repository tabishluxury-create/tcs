<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171619">
  <title>Admin sign in — The Student Collective</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');
    :root { color-scheme: dark; --ink:#171619; --paper:#f1eee7; --muted:#aaa6a0; --acid:#d8ff39; --line:rgba(241,238,231,.16); --mono:"DM Mono",monospace; --sans:"Space Grotesk",sans-serif; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; grid-template-rows:auto 1fr; background:radial-gradient(ellipse at 78% 18%,#9c7bff24,transparent 34%),var(--ink); color:var(--paper); font-family:var(--sans); -webkit-font-smoothing:antialiased; }
    a { color:inherit; text-decoration:none; }
    .wrap { width:min(1160px,calc(100% - 48px)); margin-inline:auto; }
    header { min-height:76px; display:flex; align-items:center; border-bottom:1px solid var(--line); }
    .brand { font-size:20px; font-weight:700; letter-spacing:-.08em; }
    .brand span { color:var(--acid); }
    main { display:grid; place-items:center; padding:44px 0; }
    .login-card { width:min(440px,100%); padding:clamp(26px,6vw,42px); border:1px solid var(--line); border-radius:4px; background:#201e23e8; box-shadow:0 28px 90px #0006; }
    .eyebrow { color:var(--acid); font:10px var(--mono); letter-spacing:.12em; text-transform:uppercase; }
    h1 { margin:18px 0 10px; font-size:clamp(40px,8vw,58px); line-height:.94; letter-spacing:-.07em; }
    .intro { margin:0 0 26px; color:var(--muted); font-size:14px; line-height:1.65; }
    form { display:grid; gap:16px; }
    label { display:grid; gap:7px; color:#c2beb8; font:9px var(--mono); letter-spacing:.1em; }
    input[type="password"] { width:100%; min-height:46px; padding:0 12px; border:1px solid #ffffff35; border-radius:2px; background:#171619; color:var(--paper); font:14px var(--sans); letter-spacing:normal; }
    input:focus-visible, button:focus-visible, a:focus-visible { outline:2px solid var(--acid); outline-offset:3px; }
    .remember { display:flex; align-items:center; gap:9px; color:var(--muted); font:11px var(--sans); letter-spacing:normal; }
    .remember input { width:16px; height:16px; accent-color:var(--acid); }
    button { min-height:46px; border:0; border-radius:2px; background:var(--acid); color:var(--ink); cursor:pointer; font:700 10px var(--mono); letter-spacing:.09em; }
    button:hover { box-shadow:0 8px 24px #d8ff3933; }
    .error { margin:0; padding:12px 14px; border-left:3px solid #efaa98; background:#efaa9810; color:#f0b7a8; font-size:12px; line-height:1.5; }
    .back { display:inline-block; margin-top:22px; color:var(--muted); font:9px var(--mono); letter-spacing:.08em; }
    .back:hover { color:var(--acid); }
  </style>
</head>
<body>
  <header><div class="wrap"><a class="brand" href="/tcs.html">STUDENT<span>/</span>COLLECTIVE</a></div></header>
  <main class="wrap">
    <section class="login-card" aria-labelledby="loginTitle">
      <div class="eyebrow">ADMIN ACCESS · TSC</div>
      <h1 id="loginTitle">Welcome<br>back.</h1>
      <p class="intro">Sign in to manage the Student Collective website.</p>
      <form method="post" action="{{ url_for('admin_login', next=next_path) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label for="password">PASSWORD
          <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
        </label>
        <label class="remember" for="remember">
          <input id="remember" name="remember" type="checkbox" value="1">
          Remember me on this device
        </label>
        {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
        <button type="submit">SIGN IN</button>
      </form>
      <a class="back" href="/tcs.html">← BACK TO TSC</a>
    </section>
  </main>
</body>
</html>
